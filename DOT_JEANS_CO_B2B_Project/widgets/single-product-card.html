<!-- ==========================================================================
     CROSS COUNTRY - OLD MONEY SINGLE PRODUCT CARD COMPONENT
     New Arrival • Wholesale Only • Code: OLD • Sizes: 30 to 36
     Favorite Heart Button + WhatsApp Inquiry
     ========================================================================== -->

<div class="single-card-box" id="oldMoneyCard1" data-code="OLD">
  <!-- Card Image Area with Top Badges & Favorite Heart Button -->
  <div class="single-card-media" onclick="Widgets.openLightbox('assets/images/old-money-card.jpg', 'Cross Country — Old Money (Jet Black)', 'Code: OLD • Wholesale Only • 1 Set (5 Pcs) • Sizes: 30, 32, 34, 36')">
    <!-- Top-Left Badges -->
    <div class="media-badges-group">
      <span class="media-badge-pill">New Arrival</span>
      <span class="media-badge-pill badge-wholesale">Wholesale Only</span>
    </div>

    <!-- Top-Right Floating Favorite Heart Button -->
    <button type="button" class="card-fav-btn" aria-label="Add Old Money to Favorites" onclick="event.stopPropagation(); FavoriteModule.toggle(this, 'Old Money (CODE: OLD)', 'OLD')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>

    <!-- Product Image -->
    <img src="assets/images/old-money-card.jpg" alt="Cross Country Old Money Trouser — Code OLD" class="single-card-img" onerror="this.src='assets/images/old-money-alt.jpg'">
  </div>

  <!-- Card Body Info -->
  <div class="single-card-body">
    <!-- Brand Overline + Code Badge -->
    <div class="single-card-overline">
      <span class="overline-text">CROSS COUNTRY</span>
      <span class="overline-rule"></span>
      <span class="product-code-badge">CODE: OLD</span>
    </div>

    <!-- Product Title -->
    <h3 class="single-card-title">Old Money</h3>

    <!-- Specs Row: 1 Set (5 Pcs) | Multiple Colours Available -->
    <div class="single-card-specs">
      <div class="spec-item">
        <!-- Trouser Icon -->
        <svg class="spec-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12v4l-1 14h-4l-1-10-1 10H7L6 7V3z"/>
          <path d="M6 7h12"/>
          <path d="M10 7v3"/>
          <path d="M14 7v3"/>
        </svg>
        <span class="spec-primary-text">1 Set (5 Pcs)</span>
      </div>

      <div class="spec-vertical-rule"></div>

      <div class="spec-item">
        <!-- Palette Icon -->
        <svg class="spec-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12c0 2.2 0.8 4.2 2.2 5.8 1.4 1.6 3.3 2.2 5.3 2.2 1.4 0 2.5-1.1 2.5-2.5 0-0.7-0.3-1.3-0.7-1.8-0.5-0.5-0.8-1.2-0.8-2 0-1.7 1.3-3 3-3h1.5c4.1 0 7.5-3.4 7.5-7.5C22 5.4 17.5 2 12 2z"/>
          <circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/>
          <circle cx="12" cy="6.5" r="1.2" fill="currentColor"/>
          <circle cx="16.5" cy="8.5" r="1.2" fill="currentColor"/>
        </svg>
        <div class="spec-stacked-text">
          <span>Multiple Colours</span>
          <span>Available</span>
        </div>
      </div>
    </div>

    <!-- Color Variant Swatches (Jet Black & Sand Beige) -->
    <div class="card-color-swatches">
      <span class="swatches-label">Colour:</span>
      <div class="swatches-pills">
        <button type="button" class="color-swatch-btn active" data-color="black" onclick="OldMoneyModule.switchColor(this, 'black', 'oldMoneyCard1')">
          <span class="swatch-circle swatch-black"></span>
          <span>Jet Black</span>
        </button>
        <button type="button" class="color-swatch-btn" data-color="beige" onclick="OldMoneyModule.switchColor(this, 'beige', 'oldMoneyCard1')">
          <span class="swatch-circle swatch-beige"></span>
          <span>Sand Beige</span>
        </button>
      </div>
    </div>

    <!-- Sizes Selector: 30, 32, 34, 36 (Size 30 to 36) -->
    <div class="single-card-sizes">
      <span class="sizes-heading">Sizes:</span>
      <div class="sizes-box-group">
        <button type="button" class="size-btn" data-size="30" onclick="OldMoneyModule.selectSize(this, 'oldMoneyCard1')">30</button>
        <button type="button" class="size-btn active" data-size="32" onclick="OldMoneyModule.selectSize(this, 'oldMoneyCard1')">32</button>
        <button type="button" class="size-btn" data-size="34" onclick="OldMoneyModule.selectSize(this, 'oldMoneyCard1')">34</button>
        <button type="button" class="size-btn" data-size="36" onclick="OldMoneyModule.selectSize(this, 'oldMoneyCard1')">36</button>
      </div>
    </div>

    <!-- Action Buttons: WhatsApp Enquiry + Favorite + Add to Bag -->
    <div class="single-card-actions">
      <!-- Full-Width WhatsApp Enquiry Button -->
      <button type="button" class="single-card-wa-btn" onclick="OldMoneyModule.sendWhatsApp('oldMoneyCard1')">
        <svg class="wa-glyph" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.592 2.654-.696c.969.541 1.807.828 2.806.828 3.182 0 5.768-2.587 5.768-5.767 0-3.18-2.586-5.766-5.768-5.766zm3.385 8.163c-.144.405-.837.774-1.17.825-.311.048-.71.077-2.072-.486-1.635-.678-2.686-2.348-2.768-2.457-.082-.109-.661-.88-.661-1.677 0-.797.419-1.189.569-1.352.15-.163.328-.204.437-.204.109 0 .219.001.315.006.101.005.236-.039.369.28.144.348.492 1.2.535 1.288.043.088.072.191.014.307-.058.116-.087.189-.174.29-.087.101-.183.226-.262.304-.087.086-.177.179-.076.353.101.174.45 1.054 1.34 1.848.71.633 1.309.829 1.493.916.184.087.291.073.399-.051.109-.124.465-.541.589-.726.124-.185.247-.154.415-.093.167.062 1.062.5 1.244.591.182.091.304.135.348.212.044.077.044.448-.1 1.025z"/>
        </svg>
        <span>WhatsApp Enquiry</span>
        <span class="btn-arrow-icon">&rarr;</span>
      </button>

      <!-- Secondary Row: Favorite Toggle Button & Add to Bag -->
      <div class="card-secondary-row">
        <button type="button" class="card-inline-fav-btn" onclick="FavoriteModule.toggle(this, 'Old Money (CODE: OLD)', 'OLD')">
          <svg class="heart-icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="fav-text">Favorite</span>
        </button>

        <button type="button" class="card-add-bag-btn" onclick="OldMoneyModule.addToBag('oldMoneyCard1')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span>Add to Bag</span>
        </button>
      </div>
    </div>
  </div>
</div>
